<html lang="pt-BR">
<head>

  <title>Questão 21 - Card centralizado</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; }

    <div class="card">Estou no centro da tela!</div>
  </div>
